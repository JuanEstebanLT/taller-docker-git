name: CI/CD FastAPI Docker

on:
  push:
    branches:
      - escenario-4-cicd
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  tests:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: escenario-4-cicd/ejercicio

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pytest
        run: |
          python -m pytest -v


  build-security:
    name: Build y análisis de seguridad
    runs-on: ubuntu-latest
    needs: tests

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Construir imagen para análisis
        run: |
          docker build \
            -t api-cicd:${{ github.sha }} \
            ./escenario-4-cicd/ejercicio

      - name: Analizar imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "api-cicd:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"


  publish:
    name: Publicar imagen Docker
    runs-on: ubuntu-latest
    needs: build-security

    if: startsWith(github.ref, 'refs/tags/v')

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar versiones
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          MINOR="$(echo "${VERSION}" | cut -d. -f1,2)"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ./escenario-4-cicd/ejercicio
          file: ./escenario-4-cicd/ejercicio/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-cicd:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/api-cicd:${{ steps.version.outputs.minor }}
            ${{ secrets.DOCKERHUB_USERNAME }}/api-cicd:latest
            ghcr.io/${{ steps.version.outputs.owner }}/api-cicd:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/api-cicd:${{ steps.version.outputs.minor }}
            ghcr.io/${{ steps.version.outputs.owner }}/api-cicd:latest