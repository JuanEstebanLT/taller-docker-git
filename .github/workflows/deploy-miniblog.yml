name: Deploy MiniBlog

on:
  push:
    branches:
      - docs/kubernetes-minikube

  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 03-09-2026/miniblog

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/miniblog:latest .

      - name: Publicar imagen
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/miniblog:latest