on:
  push:

jobs:
  desplegar:
    needs: probar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/miniblog:latest .

      - run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/miniblog:latest