services:
  web:
    build: .
    ports:
      - "8086:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=secreto
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=secreto
    volumes:
      - datos:/var/lib/postgresql/data

volumes:
  datos: