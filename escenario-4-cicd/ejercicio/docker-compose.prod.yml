services:

  api:
    image: ${DOCKERHUB_USERNAME}/api-cicd:latest

    container_name: cicd_fastapi_prod

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5